# GENERATED by the targets/web framework scaffold — do not edit.
# GitHub runs workflows from the repo root only, so this brand's per-target CI
# lives here and every step after the checkout runs in targets/web. Change the
# target's config (or the framework template) and run any omega verb; this file is
# rewritten from scratch.
# Ruby-free CI — @omega.js/web replaces the Jekyll pipeline: no Ruby, no
# bundler, no Gemfile. Node + `omega build` is the whole toolchain.
# Regenerated by every verb's ensureTarget — customize via config/omega.json5, not here.
#
# Deliberate deploys (D13): commits never auto-publish — save = commit,
# publish = an explicit dispatch (`omega deploy`, the CMS publish action, or
# a plain HTTP workflow_dispatch call).
name: Compile and Build Site (targets/web)

on:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  # The deploy's post-publish purge reads this (#715): an absent secret arrives
  # as an empty env value, and the verb skips the purge with a line instead of
  # failing the run.
  CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  NODE_VERSION: '24'
  # Generated from the brand's .env cascade — one line per published Actions
  # secret. Regenerated by every verb's ensureTarget; edit .env, not this.
  GOOGLE_ANALYTICS_SECRET: ${{ secrets.GOOGLE_ANALYTICS_SECRET }}
  OMEGA_LICENSE_KEY: ${{ secrets.OMEGA_LICENSE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"

      # Shallow on purpose (#568): nothing in an omega build reads git HISTORY
      # — the service worker asks `git rev-parse --short HEAD` (present at
      # depth 1) and `omega deploy --direct` inits a fresh repo in dist. A
      # full-history checkout is what took an image-heavy consumer's runner
      # down with ENOSPC (~4 GB of packed history on a ~14 GB disk).
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The firewall binary comes through Socket's own action (#871): it downloads
      # with the job's token, so the shared anonymous GitHub API quota of a hosted
      # runner never fails the step, and it caches the binary between runs.
      - name: Install Socket Firewall
        id: omega-firewall
        uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - name: Expose Socket Firewall to cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: targets/web
        run: copy "${{ steps.omega-firewall.outputs.firewall-path-binary }}" "${{ steps.omega-firewall.outputs.firewall-path-binary }}.exe"

      - name: Run node install
        working-directory: targets/web
        run: sfw npm ci --workspace .

      # No npx on a runner, in any spelling (#877): which package won npm's
      # shared `omega` bin link is an install-order accident, and an `npx omega`
      # that finds nothing linked fetches a stranger's package from the REGISTRY
      # with every secret in the job env. This workflow belongs to exactly one
      # framework, so it runs that framework's own bin FILE. The path is
      # anchored at the workspace root: npm hoists a workspace's dependencies
      # there, where a target-scoped `./node_modules` never sees them (#898).
      - name: Log versions
        working-directory: targets/web
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Omega: $(node "${{ github.workspace }}/node_modules/@omega.js/web/bin/omega" version)"

      # Optimized-image cache (the cache-uj-imagemin branch successor):
      # content-addressed, reproducible binaries — never committed. An exact
      # key hit skips all image processing; a prefix hit re-processes only
      # changed images.
      - name: Restore optimized-image cache
        uses: actions/cache@v6
        with:
          path: targets/web/.omega/cache/imagemin
          key: omega-imagemin-${{ hashFiles('targets/web/src/assets/images/**') }}
          restore-keys: |
            omega-imagemin-

      # Base path (#358): a Pages PROJECT site serves under `/<repo>/`, a
      # custom domain (the target url → CNAME) at the domain root, and
      # everything the build emits is root-relative, so the build has to be
      # told. The deploy step derives this for its own build; printing it here
      # puts the value in the log before anything consumes it, and an
      # explicitly set OMEGA_PATH_PREFIX wins in both places.
      - name: Resolve base path
        working-directory: targets/web
        run: |
          PREFIX="$(node -p "require('@omega.js/web/deploy').targetPathPrefix()")"
          echo "Base path: $PREFIX"
          echo "OMEGA_PATH_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # Tracked files only (#568) — `ls -R` printed node_modules (~45k lines)
      # and hid the build output in every run, truncating the log exactly when
      # a failure needed reading.
      - name: Log repo files
        working-directory: targets/web
        run: |
          echo "Tracked files:"
          git ls-files

      - name: Log disk usage (before build)
        working-directory: targets/web
        run: df -h /

      # ONE build and ONE push, both the framework's own (#883): `deploy
      # --direct` builds the site and force-pushes ./dist as a single orphan
      # commit to the WEBSITE repo (<brand.id>-<target>), writes the CNAME and
      # .nojekyll, points Pages at the branch, and purges the Cloudflare zone
      # when CLOUDFLARE_TOKEN is set. It is the SAME code a laptop runs, so CI
      # and a hand deploy can never publish different things. No input here
      # names a repo: the config derives it.
      #
      # NODE_ENV rides this step only (#872): at job scope npm would skip every
      # devDependency on install, and a brand's frameworks are devDependencies
      # on some targets. The build itself needs it to pick production mode.
      # GH_TOKEN is the brand's cross-repo token: the push and the Pages call
      # both land on a repo this workflow does not live in.
      - name: Build and deploy to gh-pages
        env:
          NODE_ENV: 'production'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        working-directory: targets/web
        run: node "${{ github.workspace }}/node_modules/@omega.js/web/bin/omega" deploy --direct

      # `if: always()` (#568): this reading is the one that matters when the
      # build itself is what ran out of room.
      - name: Log disk usage (after build)
        if: always()
        working-directory: targets/web
        run: df -h /
