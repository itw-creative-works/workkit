<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>tower</title>
<!--
  The whole UI: inline CSS, vanilla JS, no build step, no external request of
  any kind (the font stack is the system's own monospace). The server reads
  this file per request, so a reload is the deploy.

  Every pane renders from one endpoint and degrades on its own: a payload that
  says ok:false renders its reason where its content would be, and never blanks
  the page around it.
-->
<style>
  :root {
    --bg: #0b0e13;
    --panel: #121722;
    --panel-2: #171d2b;
    --line: #232c3d;
    --text: #d7dee9;
    --muted: #7c8798;
    --accent: #4ea1ff;
    --ok: #46c17c;
    --warn: #e0a94b;
    --bad: #e06a6a;
    --idle: #b58bd8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    padding: 12px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
  .glyph { color: var(--accent); white-space: pre; font-size: 11px; line-height: 1; }
  .spacer { flex: 1; }
  #stamp { color: var(--muted); font-size: 11px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    min-height: 38px;
  }
  button:hover { border-color: var(--accent); }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .col-head { color: var(--muted); font-size: 11px; margin-bottom: 6px; letter-spacing: 1px; }
  .card {
    display: block;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    color: var(--text);
    transition: border-color .12s ease;
  }
  .card:hover { border-color: var(--accent); text-decoration: none; }
  .card.high { border-left-color: var(--warn); }
  .card.blocked { border-left-color: var(--bad); }
  .card .repo { color: var(--muted); font-size: 11px; }
  .card .title { display: block; margin: 2px 0 4px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--muted);
    margin-right: 4px;
  }
  .badge.agent { color: var(--ok); border-color: var(--ok); }
  .badge.high { color: var(--warn); border-color: var(--warn); }
  .badge.who { color: var(--accent); border-color: var(--accent); }
  .strip { border: 1px solid var(--bad); border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  .strip h3 { font-size: 11px; color: var(--bad); margin: 0 0 6px; letter-spacing: 1px; text-transform: uppercase; }
  .strip a { display: block; padding: 2px 0; }
  .warn { color: var(--warn); font-size: 11px; margin-bottom: 6px; }
  .empty { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; font-weight: normal; letter-spacing: 1px; }
  .state-working { color: var(--ok); }
  .state-idle { color: var(--idle); }
  .state-stale { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .tile h3 { margin: 0 0 6px; font-size: 12px; }
  .tile dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 0; }
  .tile dt { color: var(--muted); font-size: 11px; }
  .tile dd { margin: 0; text-align: right; }
  .tile dd.hot { color: var(--warn); }
  form { display: grid; gap: 8px; }
  select, input, textarea {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 10px;
    width: 100%;
    min-height: 38px;
  }
  textarea { min-height: 70px; resize: vertical; }
  #intake-result { font-size: 12px; min-height: 18px; }
  #intake-result.ok { color: var(--ok); }
  #intake-result.bad { color: var(--bad); }
  @media (max-width: 700px) {
    body { padding: 8px; }
    .cols { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr; }
    button, select, input, textarea { min-height: 44px; }
  }
</style>
</head>
<body>

<header>
  <div class="glyph">/\<br>||</div>
  <h1>Tower</h1>
  <div class="spacer"></div>
  <span id="stamp">loading…</span>
  <button id="refresh" type="button">Refresh</button>
</header>

<section id="pane-board">
  <h2>The board</h2>
  <div id="board-body" class="empty">loading…</div>
</section>

<section id="pane-crew">
  <h2>The crew</h2>
  <div id="crew-body" class="empty">loading…</div>
</section>

<section id="pane-health">
  <h2>Health</h2>
  <div id="health-body" class="empty">loading…</div>
</section>

<section id="pane-intake">
  <h2>Intake</h2>
  <form id="intake-form">
    <select id="intake-repo" aria-label="Repository"></select>
    <input id="intake-title" type="text" maxlength="256" placeholder="Title" aria-label="Title">
    <textarea id="intake-body" maxlength="4000" placeholder="Body (optional)" aria-label="Body"></textarea>
    <button type="submit">File it</button>
  </form>
  <div id="intake-result"></div>
</section>

<script>
(() => {
  'use strict';

  const COLUMNS = ['inbox', 'specced', 'blocked', 'parked'];
  const $ = (id) => document.getElementById(id);

  const esc = (value) => String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const num = (value) => (value === null || value === undefined ? '—' : String(value));

  const get = async (path) => {
    const res = await fetch(path, { headers: { accept: 'application/json' } });
    return res.json();
  };

  // ── The board ───────────────────────────────────────────────────────────
  const card = (issue) => {
    const classes = ['card'];
    if (issue.status === 'blocked') classes.push('blocked');
    else if (issue.priority === 'high') classes.push('high');
    const badges = [];
    if (issue.priority === 'high') badges.push('<span class="badge high">priority</span>');
    if (issue.agentOk) badges.push('<span class="badge agent">agent:ok</span>');
    for (const who of issue.assignees || []) badges.push(`<span class="badge who">@${esc(who)}</span>`);
    if (issue.type) badges.push(`<span class="badge">${esc(issue.type)}</span>`);
    return `<a class="${classes.join(' ')}" href="${esc(issue.url)}" target="_blank" rel="noopener">
      <span class="repo">${esc(issue.repo)} #${esc(issue.number)}</span>
      <span class="title">${esc(issue.title)}</span>
      ${badges.join('')}
    </a>`;
  };

  // priority:high first, then the most recently touched.
  const rank = (a, b) => {
    const pa = a.priority === 'high' ? 0 : 1;
    const pb = b.priority === 'high' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
  };

  const renderBoard = (board) => {
    const body = $('board-body');
    body.classList.remove('empty');
    if (!board || board.ok === false) {
      body.className = 'warn';
      body.textContent = `board unavailable: ${(board && board.reason) || 'unknown reason'}`;
      return;
    }
    const issues = (board.issues || []).slice().sort(rank);
    const warnings = (board.repos || [])
      .filter((r) => r.error || r.truncated)
      .map((r) => `<div class="warn">${esc(r.slug)}: ${esc(r.error || `showing ${r.count} of ${r.totalCount} open issues`)}</div>`)
      .join('');

    const blocked = issues.filter((i) => i.status === 'blocked');
    const strip = blocked.length
      ? `<div class="strip"><h3>Blocked — ${blocked.length}</h3>${blocked
        .map((i) => `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.repo)} #${esc(i.number)} — ${esc(i.title)}</a>`)
        .join('')}</div>`
      : '';

    const cols = COLUMNS.map((status) => {
      const inCol = issues.filter((i) => i.status === status);
      const cards = inCol.length ? inCol.map(card).join('') : '<div class="empty">—</div>';
      return `<div><div class="col-head">${status} · ${inCol.length}</div>${cards}</div>`;
    }).join('');

    body.className = '';
    body.innerHTML = `${warnings}${strip}<div class="cols">${cols}</div>`;
  };

  // ── The crew ────────────────────────────────────────────────────────────
  const renderCrew = (sessions) => {
    const body = $('crew-body');
    if (!Array.isArray(sessions) || sessions.length === 0) {
      body.className = 'empty';
      body.textContent = 'no live sessions';
      return;
    }
    const rows = sessions.map((s) => `<tr>
      <td>${esc((s.cwd || '').split('/').filter(Boolean).pop() || s.cwd)}</td>
      <td>${esc(s.chatName || '—')}</td>
      <td class="state-${esc(s.state)}">${esc(s.state)}</td>
      <td>${esc(s.model || '—')}</td>
      <td>${esc(s.effort || '—')}</td>
    </tr>`).join('');
    body.className = '';
    body.innerHTML = `<table>
      <thead><tr><th>repo</th><th>chat</th><th>state</th><th>model</th><th>effort</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  };

  // ── Health tiles ────────────────────────────────────────────────────────
  const renderHealth = (health, repos, board) => {
    const body = $('health-body');
    const entries = Object.entries(health || {});
    if (entries.length === 0) {
      body.className = 'empty';
      body.textContent = 'no repos in the roster';
      return;
    }
    const slugFor = Object.fromEntries((repos || []).map((r) => [r.path, r.slug]));
    const nameFor = Object.fromEntries((repos || []).map((r) => [r.path, r.name]));
    const issues = (board && board.issues) || [];

    const tiles = entries.map(([repoPath, h]) => {
      const slug = slugFor[repoPath];
      const mine = issues.filter((i) => i.repo === slug);
      const counts = COLUMNS
        .map((status) => `${status} ${mine.filter((i) => i.status === status).length}`)
        .join(' · ');
      const hot = (n) => (typeof n === 'number' && n > 0 ? ' class="hot"' : '');
      return `<div class="tile">
        <h3>${esc(nameFor[repoPath] || repoPath)}</h3>
        <div class="warn" style="${h.error ? '' : 'display:none'}">${esc(h.error || '')}</div>
        <dl>
          <dt>open</dt><dd>${esc(counts)}</dd>
          <dt>unpushed</dt><dd${hot(h.unpushed)}>${esc(num(h.unpushed))}</dd>
          <dt>uncommitted</dt><dd${hot(h.uncommitted)}>${esc(num(h.uncommitted))}</dd>
          <dt>unreleased</dt><dd${hot(h.unreleasedEntries)}>${esc(num(h.unreleasedEntries))}</dd>
          <dt>last tag</dt><dd>${esc(h.lastTag || '—')}</dd>
        </dl>
      </div>`;
    }).join('');

    body.className = '';
    body.innerHTML = `<div class="tiles">${tiles}</div>`;
  };

  // ── The intake box ──────────────────────────────────────────────────────
  const fillRepos = (repos) => {
    const select = $('intake-repo');
    if (select.dataset.filled === '1') return;
    const slugs = (repos || []).map((r) => r.slug).filter(Boolean);
    if (slugs.length === 0) return;
    select.innerHTML = slugs.map((slug) => `<option value="${esc(slug)}">${esc(slug)}</option>`).join('');
    const hq = slugs.find((slug) => slug.toLowerCase().endsWith('/hq'));
    select.value = hq || slugs[0];
    select.dataset.filled = '1';
  };

  const file = async (event) => {
    event.preventDefault();
    const out = $('intake-result');
    const title = $('intake-title').value.trim();
    if (!title) {
      out.className = 'bad';
      out.textContent = 'title is required';
      return;
    }
    out.className = '';
    out.textContent = 'filing…';
    let result;
    try {
      const res = await fetch('/api/intake', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ repo: $('intake-repo').value, title, body: $('intake-body').value.trim() }),
      });
      result = await res.json();
    } catch (err) {
      result = { ok: false, reason: err.message };
    }
    if (result.ok) {
      out.className = 'ok';
      out.innerHTML = `filed — <a href="${esc(result.url)}" target="_blank" rel="noopener">${esc(result.url)}</a>`;
      $('intake-title').value = '';
      $('intake-body').value = '';
    } else {
      out.className = 'bad';
      out.textContent = result.reason || 'intake failed';
    }
  };

  // ── Polling ─────────────────────────────────────────────────────────────
  // The panes arrive on different clocks, so each poll keeps its payload: the
  // board carries the per-status counts the health tiles show, and the health
  // poll that runs first would otherwise paint zeros until the next one.
  let lastBoard = null;
  let lastHealth = null;
  let lastRepos = null;

  const stamp = () => {
    $('stamp').textContent = `updated ${new Date().toLocaleTimeString()}`;
  };

  const pollLive = async () => {
    const [sessions, health, repos] = await Promise.all([
      get('/api/sessions'), get('/api/health'), get('/api/repos'),
    ]);
    lastHealth = health;
    lastRepos = repos;
    renderCrew(sessions);
    renderHealth(health, repos, lastBoard);
    fillRepos(repos);
    stamp();
  };

  // `fresh=1` bypasses the server's cache — what the refresh button is FOR.
  const pollBoard = async (fresh) => {
    lastBoard = await get(fresh ? '/api/board?fresh=1' : '/api/board');
    renderBoard(lastBoard);
    if (lastHealth) renderHealth(lastHealth, lastRepos, lastBoard);
    stamp();
  };

  // The roster is repopulated first so the board and the tiles are drawn from
  // the same freshly walked list.
  const refresh = () => get('/api/repos?fresh=1')
    .then(() => Promise.all([pollBoard(true), pollLive()]))
    .catch((err) => {
      $('stamp').textContent = `offline — ${err.message}`;
    });

  $('refresh').addEventListener('click', refresh);
  $('intake-form').addEventListener('submit', file);
  refresh();
  setInterval(() => pollLive().catch(() => {}), 10000);
  setInterval(() => pollBoard().catch(() => {}), 60000);
})();
</script>

</body>
</html>
