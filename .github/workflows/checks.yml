# Checks (workflow spec): the test gate that runs on every pull request and
# every push to the default branch.
# Making it a REQUIRED check is a repo setting (branch protection / ruleset)
# a human turns on; until then it runs and reports, and the ship skill treats
# a red run as unmergeable.
# Installed once by workflow/standards.sh; after that this copy is the repo's
# own, so repo-specific steps (extra tools, matrix builds) belong here, not in
# the workflow core's template.
#
# The job runs the root npm test suite, the same proof the local
# safety:commit-gate hook requires a record of before a code commit. A repo
# without a test script passes trivially. The check exists so
# a pull request from ANY author (cloud agent, collaborator, laptop without
# the hooks) meets the same bar before merge.
#
# This repo also runs it on a push to main: the plugin ships the hooks that gate
# everything else, so a red main must show without a pull request. A push that
# changes only the CHANGELOG and the version file runs nothing (the work commit
# before it already proved that code), and neither does a tag push.
name: checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md, .claude-plugin/plugin.json]

jobs:
  suite:
    # Ubuntu and Windows: the suites that need a provisioned Mac skip themselves
    # and say so, and a macOS runner bills at ten times the rate for no added
    # coverage. Windows runs the Git Bash spellings and the script shell's build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout: Git for Windows defaults to CRLF line endings, which
      # bash cannot run, and the scratch repos the tests make inherit it too. A
      # runner also has no git identity, so a scratch commit fails without one.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.name "checks"
          git config --global user.email "checks@ci.local"
      # The runner's temp dir is 8.3 (RUNNER~1) while git and `pwd -P` answer the
      # long name, so scratch goes to runner.temp. TMP stays: Git Bash mounts /tmp
      # at TMP, and a scratch dir under that mount reads back as /tmp/... instead.
      - name: Long-form temp dir
        if: runner.os == 'Windows'
        run: printf 'TEMP=%s\nTMPDIR=%s\n' '${{ runner.temp }}' '${{ runner.temp }}' >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
      # A repo's test/run.js reaches the kit's runner, and a runner has no kit:
      # a shallow clone of the public kit, WORKKIT_ENGINE and, for the hooks, a
      # `workkit` wrapper on PATH; no link, since npm on Windows would need a
      # .cmd wrapper. The kit itself skips it.
      - name: Check out the workkit kit's runner
        shell: bash
        run: |
          if [ -f workflow/test/run.js ]; then
            echo "this repo is the kit, its runner is already here"
          else
            git clone --depth 1 https://github.com/itw-creative-works/workkit "$HOME/workkit-kit"
            # node and the runner cannot resolve Git Bash's /c/... spelling, so a Windows
            # runner exports the mixed form of both paths.
            engine="$HOME/workkit-kit/workflow"
            bin="$HOME/.local/bin"
            if command -v cygpath >/dev/null 2>&1; then
              engine="$(cygpath -m "$engine")"
              bin="$(cygpath -m "$bin")"
            fi
            echo "WORKKIT_ENGINE=$engine" >> "$GITHUB_ENV"
            mkdir -p "$HOME/.local/bin"
            printf '#!/usr/bin/env bash\nexec bash "$HOME/workkit-kit/workflow/workkit.sh" "$@"\n' > "$HOME/.local/bin/workkit"
            chmod +x "$HOME/.local/bin/workkit"
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Test
        run: npm test
  test:
    # The one check branch protection requires by name: a matrix job reports
    # one check per leg, so this fans them in and fails unless every leg passed.
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.suite.result }}" = success
  changelog:
    uses: itw-creative-works/workkit/.github/workflows/changelog.yml@main
