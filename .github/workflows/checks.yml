# Checks (workflow spec): the test gate that runs on every pull request.
# Making it a REQUIRED check is a repo setting (branch protection / ruleset)
# a human turns on; until then it runs and reports, and the ship skill treats
# a red run as unmergeable.
# Installed once by workflow/standards.sh; after that this copy is the repo's
# own, so repo-specific steps (extra tools, matrix builds) belong here, not in
# the workflow core's template.
#
# The job mirrors what the local safety/commit-gate hook runs: the npm test
# suite. A repo without a test script passes trivially. The check exists so
# a pull request from ANY author (cloud agent, collaborator, laptop without
# the hooks) meets the same bar before merge.
#
# This repo also runs the suite on every push: the plugin ships the hooks that
# gate everything else, so a red main has to be visible without waiting for
# someone to open a pull request.
name: checks

on:
  pull_request:
  push:

jobs:
  test:
    # Ubuntu and Windows: the suites that need a provisioned Mac skip themselves
    # and say so, and a macOS runner bills at ten times the rate for no added
    # coverage. Windows runs the Git Bash spellings and the script shell's build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout: Git for Windows defaults to CRLF line endings, which
      # bash cannot run, and the scratch repos the tests make inherit it too. A
      # runner also has no git identity, so a scratch commit fails without one.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.name "checks"
          git config --global user.email "checks@ci.local"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
      - name: Test
        run: npm test
  changelog:
    uses: itw-creative-works/workkit/.github/workflows/changelog.yml@main
