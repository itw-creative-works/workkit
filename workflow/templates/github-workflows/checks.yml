# Checks: the test gate on every pull request and every push to the default
# branch, run by the workkit kit's reusable workflow (.github/workflows/ci.yml),
# and on a push the GitHub release of each release commit it brings (release.yml).
# The kit owns this file and its standards step rewrites it, so no edit here
# survives: a repo's own setup commands go in .workkit/settings.json hooks.ciSetup.
name: checks

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]

jobs:
  checks:
    uses: itw-creative-works/workkit/.github/workflows/ci.yml@main
    secrets: inherit
  # A pull request never reaches it, so its token stays read-only.
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    uses: itw-creative-works/workkit/.github/workflows/release.yml@main
